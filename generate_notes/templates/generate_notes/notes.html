<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Notes - ExamAid</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        line-height: 1.6;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        max-width: 1000px;
        margin: 0 auto;
        backdrop-filter: blur(10px);
      }

      .app-name {
        text-align: center;
        color: #667eea;
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 1.1rem;
      }

      .file-info {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 30px;
        text-align: center;
      }

      .file-info h2 {
        font-size: 1.3rem;
        margin-bottom: 5px;
      }

      .file-name {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .notes-container {
        background: white;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border-left: 5px solid #667eea;
      }

      .notes-content {
        color: #333;
        font-size: 16px;
        line-height: 1.8;
      }

      /* Enhanced formatting for AI-generated content */
      .notes-content h1,
      .notes-content h2,
      .notes-content h3 {
        color: #667eea;
        margin: 25px 0 15px 0;
        font-weight: 600;
      }

      .notes-content h1 {
        font-size: 1.8rem;
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
      }

      .notes-content h2 {
        font-size: 1.5rem;
        margin-left: 0;
      }

      .notes-content h3 {
        font-size: 1.3rem;
        color: #764ba2;
      }

      .notes-content ul,
      .notes-content ol {
        margin: 15px 0;
        padding-left: 25px;
      }

      .notes-content li {
        margin: 8px 0;
        position: relative;
      }

      .notes-content ul li::marker {
        color: #667eea;
        font-weight: bold;
      }

      .notes-content ol li::marker {
        color: #f5576c;
        font-weight: bold;
      }

      .notes-content p {
        margin: 15px 0;
        text-align: justify;
      }

      .notes-content strong {
        color: #667eea;
        font-weight: 600;
      }

      .notes-content em {
        color: #764ba2;
        font-style: italic;
      }

      /* Table styling */
      .notes-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .notes-content th {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 15px;
        text-align: left;
        font-weight: 600;
      }

      .notes-content td {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
      }

      .notes-content tr:nth-child(even) {
        background: #f8f9ff;
      }

      .notes-content tr:hover {
        background: #f0f2ff;
      }

      /* Code and preformatted text */
      .notes-content code {
        background: #f8f9ff;
        padding: 2px 6px;
        border-radius: 4px;
        color: #667eea;
        font-family: "Courier New", monospace;
      }

      .notes-content pre {
        background: #f8f9ff;
        padding: 20px;
        border-radius: 10px;
        overflow-x: auto;
        border-left: 4px solid #667eea;
        margin: 20px 0;
      }

      /* Highlight boxes for important information */
      .notes-content blockquote {
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.1) 0%,
          rgba(118, 75, 162, 0.1) 100%
        );
        border-left: 4px solid #667eea;
        padding: 20px;
        margin: 20px 0;
        border-radius: 0 10px 10px 0;
        font-style: italic;
      }

      .error {
        background: #fee;
        color: #c33;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        border-left: 4px solid #c33;
        text-align: center;
      }

      .no-notes {
        text-align: center;
        color: #666;
        font-size: 1.1rem;
        padding: 40px;
        background: #f8f9ff;
        border-radius: 10px;
        border: 2px dashed #667eea;
      }

      .button-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 30px;
      }

      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        transition: all 0.3s ease;
        min-width: 140px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-secondary {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
      }

      .btn-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
      }

      .btn-success {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        color: white;
      }

      .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
      }

      .icon {
        font-size: 1.2em;
        margin-right: 8px;
      }

      /* Print styles */
      @media print {
        body {
          background: white;
          padding: 0;
        }

        .container {
          box-shadow: none;
          background: white;
        }

        .button-group {
          display: none;
        }
      }

      @media (max-width: 768px) {
        .container {
          padding: 25px;
          margin: 10px;
        }

        .app-name {
          font-size: 2rem;
        }

        .notes-content {
          font-size: 15px;
        }

        .btn {
          min-width: 120px;
          padding: 10px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="app-name">ExamAid</h1>
      <p class="subtitle">AI-Generated Study Notes</p>

      {% if notes %}
      <div class="file-info">
        <h2><span class="icon">📄</span>Study Notes Generated</h2>
        <div class="file-name">{{ uploaded_file.original_name }}</div>
      </div>

      <div class="notes-container">
        <div class="notes-content" id="notesContent">{{ notes|safe }}</div>
      </div>

      <div class="button-group">
        <button onclick="printNotes()" class="btn btn-success">
          <span class="icon">🖨️</span>Print Notes
        </button>
        <button onclick="downloadNotes()" class="btn btn-primary">
          <span class="icon">💾</span>Download
        </button>
        <a
          href="{% url 'generate_quiz:generate_quiz' uploaded_file.id %}"
          class="btn btn-secondary"
        >
          <span class="icon">🧠</span>Generate Quiz
        </a>
        <a href="{% url 'file_upload:upload_page' %}" class="btn btn-primary">
          <span class="icon">📁</span>Back to Upload
        </a>
      </div>

      {% elif error %}
      <div class="error"><span class="icon">⚠️</span>{{ error }}</div>
      <div class="button-group">
        <a href="{% url 'file_upload:upload_page' %}" class="btn btn-primary">
          <span class="icon">📁</span>Back to Upload
        </a>
      </div>

      {% else %}
      <div class="no-notes">
        <span class="icon">📝</span>No notes available. Please try uploading a
        file first.
      </div>
      <div class="button-group">
        <a href="{% url 'file_upload:upload_page' %}" class="btn btn-primary">
          <span class="icon">📁</span>Back to Upload
        </a>
      </div>
      {% endif %}
    </div>

    <script>
      function printNotes() {
        window.print();
      }

      function downloadNotes() {
        const notesContent = document.getElementById("notesContent").innerText;
        const fileName =
          '{{ uploaded_file.original_name|default:"study_notes" }}_notes.txt';
        const element = document.createElement("a");
        const file = new Blob([notesContent], { type: "text/plain" });
        element.href = URL.createObjectURL(file);
        element.download = fileName;
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
      }
    </script>
  </body>
</html>
