<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doubt Solution - ExamAid</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        max-width: 800px;
        margin: 0 auto;
        backdrop-filter: blur(10px);
      }

      .app-name {
        text-align: center;
        color: #667eea;
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 1.1rem;
      }

      .question-section {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 25px;
      }

      .question-label {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
      }

      .question-text {
        font-size: 1rem;
        line-height: 1.6;
        background: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
      }

      .answer-section {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 30px;
      }

      .answer-label {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
      }

      .answer-text {
        font-size: 1rem;
        line-height: 1.8;
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 10px;
        white-space: pre-wrap;
      }

      .button-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        transition: all 0.3s ease;
        min-width: 140px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-secondary {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
      }

      .btn-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
      }

      .icon {
        font-size: 1.2em;
        margin-right: 8px;
      }

      @media (max-width: 480px) {
        .container {
          padding: 25px;
          margin: 10px;
        }

        .app-name {
          font-size: 2rem;
        }

        .btn {
          min-width: 120px;
          padding: 10px 20px;
        }

        .question-section,
        .answer-section {
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="app-name">ExamAid</h1>
      <p class="subtitle">Your Doubt Has Been Solved!</p>

      <div class="question-section">
        <div class="question-label">
          <span class="icon">❓</span>Your Question:
        </div>
        <div class="question-text">{{ question }}</div>
      </div>

      <div class="answer-section">
        <div class="answer-label"><span class="icon">🤖</span>AI Solution:</div>
        <div class="answer-text">{{ answer }}</div>
      </div>

      <div class="button-group">
        <a href="{% url 'doubt_solver:doubt_solver' %}" class="btn btn-primary">
          <span class="icon">❓</span>Ask Another Doubt
        </a>
        <a href="{% url 'file_upload:upload_page' %}" class="btn btn-secondary">
          <span class="icon">📁</span>Back to Upload
        </a>
      </div>
    </div>
  </body>
</html>
